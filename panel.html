<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi panel · Pyra</title>
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#171412">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pyra.css">
</head>
<body>
  <header class="encabezado">
    <div class="contenedor">
      <a class="marca" href="index.html"><img src="pyra-logo.svg" alt="Pyra"></a>
      <nav class="nav" data-nav aria-label="Principal"></nav>
    </div>
  </header>

  <main class="contenedor panel">
    <!-- Crear contraseña nueva (cuando se llega desde el mail de recuperación) -->
    <div class="caja" id="recuperacion" hidden>
      <h1>Contraseña nueva</h1>
      <p>Elegí una contraseña de al menos 8 caracteres.</p>
      <div class="mensaje" id="mensaje-clave" hidden role="alert"></div>
      <form id="form-clave" novalidate>
        <div class="campo">
          <label for="clave-nueva">Contraseña nueva</label>
          <input id="clave-nueva" type="password" autocomplete="new-password" minlength="8">
        </div>
        <button class="boton boton-bronce ancho" type="submit">Guardar contraseña</button>
      </form>
    </div>

    <div id="contenido" hidden>
      <h1 id="saludo">Hola</h1>
      <div class="panel-grilla">
        <section class="bloque">
          <h2>Mis datos</h2>
          <div class="mensaje" id="mensaje-datos" hidden role="status"></div>
          <form id="form-datos" novalidate>
            <div class="campo">
              <label for="nombre">Nombre y apellido</label>
              <input id="nombre" autocomplete="name">
            </div>
            <div class="campo">
              <label for="telefono">Teléfono</label>
              <input id="telefono" type="tel" autocomplete="tel" placeholder="387 555 1234">
            </div>
            <label class="casilla">
              <input id="es-dueno" type="checkbox">
              <span>Quiero publicar espacios en Pyra</span>
            </label>
            <button class="boton boton-bronce ancho" id="guardar" type="submit">Guardar datos</button>
          </form>
        </section>

        <div>
          <section class="bloque" id="bloque-espacios" hidden>
            <div class="bloque-cabecera">
              <h2>Mis espacios</h2>
              <a class="boton boton-bronce" href="espacio.html">Publicar un espacio</a>
            </div>
            <div class="mensaje" id="mensaje-espacios" hidden role="status"></div>
            <div id="lista-espacios"><p class="vacio">Cargando...</p></div>
          </section>
          <section class="bloque" id="bloque-recibidas" hidden>
            <h2>Reservas de mis espacios</h2>
            <div id="lista-recibidas"></div>
          </section>
          <section class="bloque">
            <h2>Mis reservas</h2>
            <div class="mensaje" id="mensaje-pago" hidden role="status"></div>
            <div id="lista-reservas"><p class="vacio">Cargando...</p></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const el = (id) => document.getElementById(id);
    const vieneDeRecuperacion = location.hash.includes("type=recovery");

    db.auth.onAuthStateChange((evento) => {
      if (evento === "PASSWORD_RECOVERY") mostrarRecuperacion();
    });

    function mostrarRecuperacion() {
      el("contenido").hidden = true;
      el("recuperacion").hidden = false;
    }

    el("form-clave").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const clave = el("clave-nueva").value;
      if (clave.length < 8) return mostrarMensaje(el("mensaje-clave"), "La contraseña tiene que tener al menos 8 caracteres.");
      const { error } = await db.auth.updateUser({ password: clave });
      if (error) return mostrarMensaje(el("mensaje-clave"), traducirError(error));
      el("recuperacion").hidden = true;
      cargarPanel();
    });

    async function cargarPanel() {
      const usuario = await usuarioActual();
      if (!usuario) { location.href = "ingresar.html"; return; }

      let { data: perfil, error } = await db.from("perfiles").select("*").eq("id", usuario.id).single();
      if (error) { el("saludo").textContent = "No se pudieron cargar tus datos. Recargá la página."; el("contenido").hidden = false; return; }

      // Si al registrarse marcó que quiere publicar, se activa una sola vez
      if (usuario.user_metadata && usuario.user_metadata.quiere_publicar && !perfil.es_dueno) {
        const r = await db.from("perfiles").update({ es_dueno: true }).eq("id", usuario.id).select().single();
        if (r.error) {
          console.error("No se pudo activar el perfil de dueño:", r.error);
        } else {
          perfil = r.data;
          await db.auth.updateUser({ data: { quiere_publicar: false } });
        }
      }

      el("saludo").textContent = perfil.nombre ? "Hola, " + perfil.nombre.split(" ")[0] : "Hola";
      el("nombre").value = perfil.nombre || "";
      el("telefono").value = perfil.telefono || "";
      el("es-dueno").checked = perfil.es_dueno;
      el("bloque-espacios").hidden = !perfil.es_dueno;
      el("contenido").hidden = false;
      if (perfil.es_dueno) { cargarEspacios(usuario.id); cargarRecibidas(); }
      cargarReservas();
      avisoDePago();

      const guardado = new URLSearchParams(location.search).get("guardado");
      if (guardado) mostrarMensaje(el("mensaje-espacios"),
        guardado === "publicado" ? "Tu espacio está publicado." : "Tu espacio quedó guardado sin publicar.", "ok");
    }

    const ESTADOS_RESERVA = {
      pendiente_pago: "Esperando pago", confirmada: "Confirmada", completada: "Completada",
      cancelada_con_reembolso: "Cancelada con reembolso", cancelada_sin_reembolso: "Cancelada sin reembolso",
      expirada: "Vencida sin pagar"
    };

    async function cargarReservas() {
      const { data, error } = await db.rpc("mis_reservas");
      const lista = el("lista-reservas");
      if (error) { lista.innerHTML = '<p class="vacio">No se pudieron cargar tus reservas. Recargá la página.</p>'; return; }
      if (!data.length) { lista.innerHTML = '<p class="vacio">Todavía no tenés reservas. <a href="buscar.html">Buscá un espacio</a>.</p>'; return; }
      lista.innerHTML = data.map(r => `
        <article class="item-reserva">
          <h3><a href="ver.html?id=${r.espacio_id}">${textoSeguro(r.titulo)}</a></h3>
          <p>${fechaLarga(r.inicio)}, de ${hora(r.inicio)} a ${hora(r.fin)}. Total ${pesos(r.monto_total)}</p>
          <span class="etiqueta etiqueta-${r.estado}">${ESTADOS_RESERVA[r.estado] || r.estado}</span>
          ${r.estado === "pendiente_pago" ? `<button type="button" class="boton boton-bronce boton-chico" data-pagar="${r.id}">Pagar ahora</button>` : ""}
          ${r.direccion ? `<p class="detalle-confirmado">Dirección: ${textoSeguro(r.direccion)}, ${textoSeguro(r.ciudad)}<br>
            Contacto: ${textoSeguro(r.dueno_nombre)}${r.dueno_telefono ? ", " + textoSeguro(r.dueno_telefono) : ""}</p>` : ""}
        </article>`).join("");
      lista.querySelectorAll("[data-pagar]").forEach(b => b.addEventListener("click", async () => {
        b.disabled = true; b.textContent = "Abriendo Mercado Pago...";
        const problema = await irAPagar(b.dataset.pagar);
        if (problema) { mostrarMensaje(el("mensaje-pago"), problema); b.disabled = false; b.textContent = "Pagar ahora"; }
      }));
    }

    function avisoDePago() {
      const pago = new URLSearchParams(location.search).get("pago");
      const textos = {
        aprobado: ["Pago aprobado. Tu reserva se confirma en unos segundos; si todavía dice \"Esperando pago\", recargá la página.", "ok"],
        pendiente: ["Tu pago quedó pendiente de aprobación. Cuando Mercado Pago lo apruebe, la reserva se confirma sola.", "ok"],
        rechazado: ["El pago no se completó. Podés intentar de nuevo con \"Pagar ahora\" antes de que venza la reserva.", "error"]
      };
      if (textos[pago]) mostrarMensaje(el("mensaje-pago"), textos[pago][0], textos[pago][1]);
      if (pago === "aprobado") setTimeout(cargarReservas, 4000);
    }

    async function cargarRecibidas() {
      const { data, error } = await db.rpc("reservas_de_mis_espacios");
      if (error || !data.length) return;
      el("bloque-recibidas").hidden = false;
      el("lista-recibidas").innerHTML = data.map(r => `
        <article class="item-reserva">
          <h3>${textoSeguro(r.titulo)}</h3>
          <p>${fechaLarga(r.inicio)}, de ${hora(r.inicio)} a ${hora(r.fin)}. Recibís ${pesos(r.monto_dueno)}</p>
          <span class="etiqueta etiqueta-${r.estado}">${ESTADOS_RESERVA[r.estado] || r.estado}</span>
          ${r.cliente_nombre ? `<p class="detalle-confirmado">Cliente: ${textoSeguro(r.cliente_nombre)}${r.cliente_telefono ? ", " + textoSeguro(r.cliente_telefono) : ""}</p>` : ""}
        </article>`).join("");
    }

    async function cargarEspacios(idUsuario) {
      const { data, error } = await db.from("espacios")
        .select("id, titulo, estado, precio_hora, tipos_espacio(nombre), fotos_espacio(ruta, orden)")
        .eq("dueno_id", idUsuario).order("creado_at", { ascending: false });
      const lista = el("lista-espacios");
      if (error) { lista.innerHTML = '<p class="vacio">No se pudieron cargar tus espacios. Recargá la página.</p>'; return; }
      if (!data.length) { lista.innerHTML = '<p class="vacio">Todavía no publicaste espacios.</p>'; return; }
      const nombresEstado = { publicado: "Publicado", borrador: "Sin publicar", pausado: "Pausado" };
      lista.innerHTML = data.map(e => {
        const portada = (e.fotos_espacio || []).sort((a, b) => a.orden - b.orden)[0];
        const img = portada
          ? `<img src="${db.storage.from("fotos-espacios").getPublicUrl(portada.ruta).data.publicUrl}" alt="">`
          : '<div class="sin-foto">Sin foto</div>';
        const titulo = document.createElement("span"); titulo.textContent = e.titulo;
        return `<article class="item-espacio">
          ${img}
          <div>
            <h3>${titulo.innerHTML}</h3>
            <p>${e.tipos_espacio ? e.tipos_espacio.nombre : ""}, $${Number(e.precio_hora).toLocaleString("es-AR")} por hora</p>
            <span class="etiqueta etiqueta-${e.estado}">${nombresEstado[e.estado] || e.estado}</span>
          </div>
          <a class="boton" href="espacio.html?id=${e.id}">Editar</a>
        </article>`;
      }).join("");
    }

    el("form-datos").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const nombre = el("nombre").value.trim();
      if (nombre.length < 3) return mostrarMensaje(el("mensaje-datos"), "Escribí tu nombre y apellido.");
      const boton = el("guardar");
      boton.disabled = true;
      const usuario = await usuarioActual();
      const { error } = await db.from("perfiles").update({
        nombre, telefono: el("telefono").value.trim() || null, es_dueno: el("es-dueno").checked
      }).eq("id", usuario.id);
      boton.disabled = false;
      if (error) return mostrarMensaje(el("mensaje-datos"), traducirError(error));
      mostrarMensaje(el("mensaje-datos"), "Datos guardados.", "ok");
      el("bloque-espacios").hidden = !el("es-dueno").checked;
      el("saludo").textContent = "Hola, " + nombre.split(" ")[0];
    });

    if (vieneDeRecuperacion) mostrarRecuperacion(); else cargarPanel();
  </script>
</body>
</html>
